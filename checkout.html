<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBSKURA | Secure Checkout</title>
    <script src="https://js.stripe.com/v3/"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        :root { 
            --accent: #8f5aff; 
            --bg: #0a0a0a; 
            --surface: #141414; 
            --border: #27272a; 
        }
        body { 
            background: var(--bg); 
            color: white; 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
        }
        .checkout-layout { 
            display: grid; 
            grid-template-columns: 1fr 450px; 
            min-height: 100vh; 
        }
        
        .checkout-form { padding: 80px 10%; }
        .input-group { margin-bottom: 25px; }
        label { 
            display: block; 
            font-size: 0.7rem; 
            color: #a1a1aa; 
            margin-bottom: 8px; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
        }
        input, #card-element { 
            width: 100%; 
            padding: 15px; 
            background: var(--surface); 
            border: 1px solid var(--border); 
            color: white; 
            outline: none; 
        }

        #card-element { padding: 18px; }
        #card-errors { color: #ff4d4d; font-size: 0.75rem; margin-top: 10px; }

        .order-summary { 
            background: #0c0c0c; 
            border-left: 1px solid var(--border); 
            padding: 80px 50px; 
        }
        .summary-item { 
            display: flex; 
            gap: 20px; 
            margin-bottom: 25px; 
            align-items: center; 
        }
        .summary-img { 
            width: 70px; 
            height: 90px; 
            object-fit: cover; 
            background: #1a1a1a; 
        }

        .btn { 
            width: 100%; 
            padding: 20px; 
            background: var(--accent); 
            color: black; 
            font-weight: 800; 
            border: none; 
            cursor: pointer; 
            margin-top: 30px;
            letter-spacing: 2px; 
            transition: 0.3s;
        }
        .btn:hover { background: #7a46e6; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        @media (max-width: 900px) {
            .checkout-layout { grid-template-columns: 1fr; }
            .order-summary { 
                order: -1; 
                padding: 40px 10%; 
                border-left: none; 
                border-bottom: 1px solid var(--border); 
            }
        }
    </style>
</head>
<body>

    <div class="checkout-layout">
        <div class="checkout-form">
            <a href="shop.html" style="color:var(--accent); text-decoration:none; font-size:0.7rem; letter-spacing:1px;">← RETURN TO SHOP</a>
            <h1 style="margin: 30px 0; font-size: 1.5rem; letter-spacing: 2px;">CHECKOUT</h1>

            <div class="input-group">
                <label>Email Address</label>
                <input type="email" placeholder="email@example.com">
            </div>

            <div class="input-group">
                <label>Shipping Address</label>
                <input type="text" placeholder="Full Name" style="margin-bottom:10px;">
                <input type="text" placeholder="Address">
            </div>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-bottom:25px;">
                <input type="text" placeholder="City">
                <input type="text" placeholder="Postal Code">
            </div>

            <label>Payment Method</label>
            <div id="card-element"></div>
            <div id="card-errors" role="alert"></div>

            <button id="submit-button" class="btn">PAY SECURELY</button>
        </div>

        <div class="order-summary">
            <h2 style="font-size:0.8rem; letter-spacing:3px; margin-bottom:40px; opacity:0.6;">YOUR ORDER</h2>
            
            <div id="summaryItems">
                </div>

            <div style="margin-top:40px; border-top:1px solid var(--border); padding-top:25px;">
                <div style="display:flex; justify-content:space-between; margin-bottom:10px; font-size:0.8rem; opacity:0.6;">
                    <span>Subtotal</span>
                    <span id="subTotal">$0.00</span>
                </div>
                <div style="display:flex; justify-content:space-between; margin-bottom:10px; font-size:0.8rem; opacity:0.6;">
                    <span>Shipping</span>
                    <span>Calculated at next step</span>
                </div>
                <div style="display:flex; justify-content:space-between; margin-top:20px; font-size:1.1rem; font-weight:700;">
                    <span>Total</span>
                    <span id="grandTotal" style="color:var(--accent);">$0.00</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Stripe Configuration
        const stripe = Stripe('pk_test_your_key_here'); // Replace with your live or test key
        const elements = stripe.elements();
        const card = elements.create('card', {
            style: {
                base: { 
                    color: '#ffffff', 
                    fontFamily: 'Inter, sans-serif', 
                    fontSize: '16px', 
                    '::placeholder': { color: '#555' } 
                },
                invalid: { color: '#ff4d4d' }
            }
        });
        card.mount('#card-element');

        // Load and Display Cart Data from localStorage
        const cart = JSON.parse(localStorage.getItem('obskuraCart')) || [];
        const summaryContainer = document.getElementById('summaryItems');
        
        if(cart.length === 0) {
            summaryContainer.innerHTML = "<p style='opacity:0.4;'>Your bag is empty.</p>";
        } else {
            summaryContainer.innerHTML = cart.map(item => `
                <div class="summary-item">
                    <img src="${item.image}" class="summary-img" alt="${item.name}">
                    <div style="flex-grow:1;">
                        <h4 style="font-size:0.75rem; text-transform:uppercase; margin:0; letter-spacing:1px;">${item.name}</h4>
                        <p style="font-size:0.65rem; color:#555; margin-top:5px;">QTY: 1</p>
                    </div>
                    <span style="font-weight:600; font-size:0.9rem;">$${item.price}</span>
                </div>
            `).join('');

            const total = cart.reduce((sum, item) => sum + parseFloat(item.price), 0);
            document.getElementById('subTotal').innerText = `$${total.toFixed(2)}`;
            document.getElementById('grandTotal').innerText = `$${total.toFixed(2)}`;
        }

        // Handle Payment Submission
        const formBtn = document.getElementById('submit-button');
        formBtn.addEventListener('click', async () => {
            formBtn.disabled = true;
            formBtn.innerText = "PROCESSING...";
            
            const {token, error} = await stripe.createToken(card);

            if (error) {
                document.getElementById('card-errors').textContent = error.message;
                formBtn.disabled = false;
                formBtn.innerText = "PAY SECURELY";
            } else {
                // Successful Payment Simulation
                console.log('Stripe Token:', token);
                alert("Payment Authorized. Thank you for shopping with OBSKURA.");
                localStorage.removeItem('obskuraCart');
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
