<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | ABSKURA</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Montserrat:wght@900&display=swap" rel="stylesheet">
    <style>
        :root {
            --gym-black: #000000;
            --gym-white: #ffffff;
            --accent: #8f5aff;
            --field-bg: #111111;
            --border: #222;
        }

        body { background: var(--gym-black); color: var(--gym-white); margin: 0; font-family: 'Inter', sans-serif; }

        .checkout-layout {
            display: grid;
            grid-template-columns: 1fr 450px;
            min-height: 100vh;
        }

        /* Left Side: Information */
        .checkout-main { padding: 60px 10% 60px 15%; }
        .checkout-logo { font-family: 'Montserrat', sans-serif; font-size: 1.5rem; letter-spacing: 4px; text-decoration: none; color: white; display: block; margin-bottom: 40px; }
        
        .checkout-section { margin-bottom: 40px; }
        .checkout-section h2 { font-size: 1.1rem; margin-bottom: 20px; font-weight: 700; }

        /* Form Elements */
        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        input, select {
            background: var(--field-bg); border: 1px solid var(--border); padding: 15px;
            color: white; width: 100%; box-sizing: border-box; font-size: 0.9rem;
            transition: 0.3s;
        }
        input:focus { border-color: var(--accent); outline: none; }

        /* Right Side: Order Summary */
        .checkout-summary {
            background: #080808; padding: 60px 40px; border-left: 1px solid var(--border);
        }
        .summary-item {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
        }
        .summary-item img { width: 64px; height: 64px; background: #111; border: 1px solid var(--border); margin-right: 15px; }
        
        .price-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.9rem; opacity: 0.7; }
        .total-row { display: flex; justify-content: space-between; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border); font-weight: 800; font-size: 1.2rem; }

        .btn-pay {
            width: 100%; padding: 20px; background: var(--gym-white); color: black;
            border: none; font-weight: 800; text-transform: uppercase; letter-spacing: 2px;
            cursor: pointer; margin-top: 30px; transition: 0.3s;
        }
        .btn-pay:hover { background: var(--accent); color: white; }

        @media (max-width: 1000px) {
            .checkout-layout { grid-template-columns: 1fr; }
            .checkout-summary { order: -1; padding: 40px 5%; }
            .checkout-main { padding: 40px 5%; }
        }
    </style>
</head>
<body>

<div class="checkout-layout">
    <main class="checkout-main">
        <a href="index.html" class="checkout-logo">ABSKURA</a>
        
        <div class="checkout-section">
            <h2>Contact Information</h2>
            <input type="email" placeholder="Email address" required>
        </div>

        <div class="checkout-section">
            <h2>Shipping Address</h2>
            <div class="input-grid">
                <input type="text" placeholder="First name">
                <input type="text" placeholder="Last name">
            </div>
            <input type="text" placeholder="Address" style="margin-bottom:15px;">
            <div class="input-grid">
                <input type="text" placeholder="City">
                <input type="text" placeholder="Postal code">
            </div>
            <select>
                <option>United States</option>
                <option>Canada</option>
                <option>United Kingdom</option>
            </select>
        </div>

        <div class="checkout-section">
            <h2>Payment</h2>
            <div style="background: #111; padding: 20px; border: 1px solid #222;">
                <p style="font-size: 0.8rem; opacity: 0.5; margin-bottom: 15px;">All transactions are secure and encrypted.</p>
                <input type="text" placeholder="Card number" style="margin-bottom:15px;">
                <div class="input-grid">
                    <input type="text" placeholder="Expiration date (MM / YY)">
                    <input type="text" placeholder="Security code">
                </div>
            </div>
        </div>
        
        <button class="btn-pay">Complete Purchase</button>
    </main>

    <aside class="checkout-summary">
        <div id="checkout-items-list">
            <div class="summary-item">
                <div style="display:flex; align-items:center;">
                    <img src="images/Black Shirt Front.png" alt="Product">
                    <div>
                        <div style="font-size:0.8rem; font-weight:700;">Black Performance Tee</div>
                        <div style="font-size:0.7rem; opacity:0.5;">Size: L</div>
                    </div>
                </div>
                <div style="font-size:0.9rem;">$26.99</div>
            </div>
        </div>

        <div style="margin-top:40px;">
            <div class="price-row"><span>Subtotal</span><span>$26.99</span></div>
            <div class="price-row"><span>Shipping</span><span>Calculated at next step</span></div>
            <div class="total-row"><span>Total</span><span>USD $26.99</span></div>
        </div>
    </aside>
</div>

<script src="app.js"></script>
</body>
</html>
