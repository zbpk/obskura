<!DOCTYPE html>
<html>
<head>
  <title>Beige Compression Shirt — OBSKURA</title>
  <link rel="stylesheet" href="../style.css">
</head>

<body>

<!-- HEADER (matches your new global header) -->
<header class="site-header">
  <div class="header-left">
    <div class="logo">OBSKURA</div>
  </div>

  <div class="header-right">
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>

<section class="product-page">

  <div class="image-switcher">
    <img id="productImage" src="../images/Beige Shirt Front.png" alt="Beige Compression Shirt" class="product-image" style="width:350px; border-radius:10px;">
    
    <div class="image-buttons" style="margin-top:15px;">
      <button onclick="showFront()" style="padding:8px 14px; margin-right:10px;">Front</button>
      <button onclick="showBack()" style="padding:8px 14px;">Back</button>
    </div>
  </div>

  <div class="product-info">
    <h1>Beige Compression Shirt</h1>

    <p class="description">
      A warm, neutral layer engineered for quiet confidence.  
      Contour lines glide across the torso like soft circuitry, shaping a silhouette that feels grounded, calm, and effortlessly composed.
    </p>

    <h3>Choose Size</h3>
    <select class="size-select" style="padding:10px; background:#0d0d0d; color:white; border:1px solid #333;">
      <option>2XS</option>
      <option>XS</option>
      <option>Small</option>
      <option>Medium</option>
      <option>Large</option>
      <option>XL</option>
      <option>2XL</option>
      <option>3XL</option>
      <option>4XL</option>
      <option>5XL</option>
    </select>

    <div class="price" style="margin-top:20px;">$26.99</div>

    <a class="btn" href="#" style="margin-top:20px; display:inline-block;">Add to Cart</a>
  </div>

</section>

<script>
  function showFront() {
    document.getElementById("productImage").src = "../images/Beige Shirt Front.png";
  }

  function showBack() {
    document.getElementById("productImage").src = "../images/Beige Shirt Back.png";
  }
</script>

</body>
</html>
