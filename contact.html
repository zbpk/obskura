<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBSKURA — Contact</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- HEADER (global OBSKURA header) -->
<header class="site-header">
  <div class="header-left">
    <div class="logo">OBSKURA</div>
  </div>

  <div class="header-right">
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>

    <!-- MOBILE MENU BUTTON -->
    <div class="hamburger">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>
</header>

<!-- CONTACT PAGE CONTENT -->
<section class="page" style="max-width: 800px; margin: 60px auto; text-align: center;">
  <h1 style="color:#8f5aff; text-transform:uppercase; letter-spacing:6px; margin-bottom:20px;">
    Contact Us
  </h1>

  <p style="opacity:0.8; margin-bottom:30px;">
    Have questions about OBSKURA? Reach out below.
  </p>

  <!-- WORKING EMAIL FORM -->
  <form class="contact-form"
        action="https://formsubmit.co/obskura.noreply@gmail.com"
        method="POST"
        style="display:flex; flex-direction:column; gap:20px; margin-top:20px;">

    <!-- Disable CAPTCHA -->
    <input type="hidden" name="_captcha" value="false">

    <!-- Redirect after sending -->
    <input type="hidden" name="_next" value="https://yourwebsite.com/thankyou.html">

    <input type="text" name="name" placeholder="Your Name" required
           style="padding:14px; background:#111; border:1px solid #222; color:#fff; border-radius:6px;">

    <input type="email" name="email" placeholder="Your Email" required
           style="padding:14px; background:#111; border:1px solid #222; color:#fff; border-radius:6px;">

    <textarea name="message" placeholder="Your Message" required
              style="padding:14px; background:#111; border:1px solid #222; color:#fff; border-radius:6px; height:140px;"></textarea>

    <button class="btn"
            style="padding:14px; background:#8f5aff; border:none; color:#000; font-weight:700; text-transform:uppercase; letter-spacing:1px; cursor:pointer; border-radius:6px;">
      Send
    </button>
  </form>
</section>

<!-- MOBILE MENU SCRIPT -->
<script>
  const hamburger = document.querySelector('.hamburger');
  const navLinks = document.querySelector('.nav-links');

  hamburger.addEventListener('click', () => {
    navLinks.classList.toggle('open');
    hamburger.classList.toggle('open');
  });
</script>

<!-- HEADER SHADOW ON SCROLL -->
<script>
  window.addEventListener('scroll', () => {
    const header = document.querySelector('.site-header');
    if (window.scrollY > 10) {
      header.classList.add('scrolled');
    } else {
      header.classList.remove('scrolled');
    }
  });
</script>
<div class="cart-trigger" onclick="toggleCart()">
    <span class="cart-count">0</span>
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
</div>

<div class="cart-overlay" onclick="toggleCart()"></div>
<div class="cart-sidebar" id="cartSidebar">
    <div style="padding: 30px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #222;">
        <h2 style="font-size:0.8rem; letter-spacing:3px;">YOUR BAG</h2>
        <span onclick="toggleCart()" style="cursor:pointer;">CLOSE ✕</span>
    </div>
    <div id="cartItems" style="padding: 30px; flex-grow:1; overflow-y:auto;"></div>
    <div style="padding: 30px; border-top:1px solid #222;">
        <div style="display:flex; justify-content:space-between; margin-bottom:20px; font-weight:600;">
            <span>TOTAL</span>
            <span id="cartSubtotal">$0.00</span>
        </div>
        <button onclick="location.href='checkout.html'" style="width:100%; padding:15px; background:#8f5aff; color:white; border:none; font-weight:bold; cursor:pointer;">PROCEED TO CHECKOUT</button>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
