<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | OBSKURA Support</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Montserrat:wght@900&display=swap" rel="stylesheet">
    <style>
        :root {
            --gym-black: #000000;
            --gym-white: #ffffff;
            --accent: #8f5aff;
            --field-bg: #111111;
        }

        body { background: var(--gym-black); color: var(--gym-white); margin: 0; font-family: 'Inter', sans-serif; }

        /* Sticky Nav to match index.html */
        .site-header {
            position: fixed; top: 0; width: 100%; z-index: 1000;
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 5%; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px);
            border-bottom: 1px solid #222; box-sizing: border-box;
        }

        .contact-container {
            max-width: 800px; margin: 150px auto 100px; padding: 0 5%;
        }

        .contact-header { text-align: center; margin-bottom: 60px; }
        .contact-header h1 { font-family: 'Montserrat', sans-serif; font-size: 3rem; letter-spacing: -1px; margin-bottom: 10px; }
        .contact-header p { opacity: 0.6; font-size: 1rem; }

        /* Form Styling */
        .contact-form { display: grid; gap: 20px; }
        .form-group { display: flex; flex-direction: column; }
        
        .form-group label { 
            font-size: 0.65rem; font-weight: 800; text-transform: uppercase; 
            letter-spacing: 1.5px; margin-bottom: 8px; color: #888;
        }

        .contact-form input, .contact-form textarea, .contact-form select {
            background: var(--field-bg); border: 1px solid #222; padding: 18px;
            color: white; font-family: 'Inter', sans-serif; font-size: 0.9rem;
            transition: 0.3s;
        }

        .contact-form input:focus, .contact-form textarea:focus {
            outline: none; border-color: var(--accent); background: #161616;
        }

        .btn-submit {
            background: var(--gym-white); color: var(--gym-black);
            padding: 20px; border: none; font-weight: 800;
            text-transform: uppercase; letter-spacing: 2px;
            cursor: pointer; transition: 0.3s; margin-top: 10px;
        }

        .btn-submit:hover { background: var(--accent); color: white; }

        /* Support Grid */
        .support-grid {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 20px; margin-top: 80px; border-top: 1px solid #222; padding-top: 60px;
        }
        .support-card { text-align: center; padding: 20px; }
        .support-card h3 { font-size: 0.7rem; letter-spacing: 2px; margin-bottom: 10px; color: var(--accent); }
        .support-card p { font-size: 0.85rem; opacity: 0.5; }

        @media (max-width: 600px) {
            .support-grid { grid-template-columns: 1fr; }
            .contact-header h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

<header class="site-header">
    <a href="index.html" class="logo" style="font-weight:900; letter-spacing:4px; text-decoration:none; color:white;">OBSKURA</a>
    <nav class="nav-links">
        <a href="index.html" style="color:white; text-decoration:none; margin-left:20px; font-size:0.7rem; font-weight:700;">HOME</a>
        <a href="index.html#featured" style="color:white; text-decoration:none; margin-left:20px; font-size:0.7rem; font-weight:700;">SHOP</a>
    </nav>
</header>

<div class="contact-container">
    <div class="contact-header">
        <h1>GET IN TOUCH</h1>
        <p>Our team typically responds within 24 hours.</p>
    </div>

    <form class="contact-form">
        <div class="form-group">
            <label>Inquiry Type</label>
            <select>
                <option>Order Status</option>
                <option>Returns & Exchanges</option>
                <option>Sponsorships</option>
                <option>General Question</option>
            </select>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="form-group">
                <label>First Name</label>
                <input type="text" placeholder="John">
            </div>
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" placeholder="Doe">
            </div>
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" placeholder="john@example.com">
        </div>

        <div class="form-group">
            <label>Message</label>
            <textarea rows="6" placeholder="How can we help?"></textarea>
        </div>

        <button type="submit" class="btn-submit">Send Message</button>
    </form>

    <div class="support-grid">
        <div class="support-card">
            <h3>SHIPPING</h3>
            <p>Track your latest OBSKURA drop.</p>
        </div>
        <div class="support-card">
            <h3>RETURNS</h3>
            <p>30-day hassle-free return policy.</p>
        </div>
        <div class="support-card">
            <h3>FAQ</h3>
            <p>Find quick answers to common questions.</p>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
